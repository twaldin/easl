name: Note cold spell-check regression experiment

on:
  push:
    branches: [lane/easl-churn-outlier-1]

permissions:
  contents: read

concurrency:
  group: mermaid-churn-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spell-preflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select Command Line Tools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools
      - name: Build original product
        run: |
          git show 500cc93b93d4e122625793b10fbd04a807e9dd0f:Sources/CanvasApp/Notes/NoteTile.swift > Sources/CanvasApp/Notes/NoteTile.swift
          swift build --build-system native -c release -j 2 --product Easl -Xswiftc -enable-testing
      - name: Prove read-only spell-service activation before fix
        run: |
          code=0
          python3 Tests/NoteMermaidChurn/run.py --spell-probe --artifacts "$RUNNER_TEMP/spell-before" --bin-path "$(swift build --build-system native -c release --show-bin-path)" || code=$?
          test "$code" -eq 1
          python3 - "$RUNNER_TEMP/spell-before/native.jsonl" <<'PY'
          import json, pathlib, sys
          records = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith('{')]
          probe = next(r for r in records if r['event'] == 'spell-preflight-probe')
          assert probe['viewingCalls'] > 0 and probe['spellingEnabledWhileEditing'], probe
          print(json.dumps({'event': 'failing-before-confirmed', **probe}, sort_keys=True))
          PY
      - name: Build fixed product
        run: |
          git show "$GITHUB_SHA:Sources/CanvasApp/Notes/NoteTile.swift" > Sources/CanvasApp/Notes/NoteTile.swift
          swift build --build-system native -c release -j 2 --product Easl -Xswiftc -enable-testing
      - name: Prove read-only isolation and editing spell checks after fix
        run: python3 Tests/NoteMermaidChurn/run.py --spell-probe --artifacts "$RUNNER_TEMP/spell-after" --bin-path "$(swift build --build-system native -c release --show-bin-path)"
      - name: Exercise unchanged full churn gate on fixed product
        run: python3 Tests/NoteMermaidChurn/run.py --artifacts "$RUNNER_TEMP/fixed-churn" --bin-path "$(swift build --build-system native -c release --show-bin-path)"
