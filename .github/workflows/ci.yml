name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Select Swift 6.4
        run: scripts/select-ci-swift.sh
      - name: Build
        run: swift build -j 2
      - name: Test
        run: |
          swift --version
          bun --version
          cores=$(sysctl -n hw.ncpu)
          width=$((cores * 4))
          printf 'hw.ncpu: %s\nCore parallelization width: %s\n' "$cores" "$width"
          swift run -j 2 CanvasCoreTests --experimental-maximum-parallelization-width "$width"
      - name: Native composer editing regression
        run: |
          swift build --build-system native -j 2 --product Easl
          python3 Tests/ComposerInput/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native composer delivery regression
        run: python3 Tests/ComposerDelivery/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native terminal activity regression
        run: python3 Tests/TerminalEcho/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native terminal submission regression
        run: python3 Tests/TerminalSubmission/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native initial arrow routing regression
        run: python3 Tests/InitialRouting/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native Move Escape regression
        run: python3 Tests/MoveEscape/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native browser initial admission regression
        run: python3 Tests/BrowserInitialAdmission/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native clear browsing data regression
        run: python3 Tests/ClearBrowsingData/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native browser wait navigation regression
        run: python3 Tests/BrowserWait/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native cold browser first-command regression
        run: python3 Tests/BrowserColdCommands/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native held cold browser response regression
        run: python3 Tests/BrowserColdResponse/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native HTML tile keyboard regression
        id: html-keyboard
        run: python3 Tests/HtmlKeyboard/run.py --bin-path "$(swift build --build-system native --show-bin-path)" --artifacts "${{ runner.temp }}/html-export-artifacts"
      - name: Preserve HTML export evidence
        if: always() && steps.html-keyboard.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: html-export-diagnostics
          path: ${{ runner.temp }}/html-export-artifacts
          if-no-files-found: error
      - name: Native terminal rekey focus regression
        run: python3 Tests/TerminalRekey/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native HTML page send trust regression
        run: python3 Tests/HtmlSend/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native HTML and note object navigation regression
        run: python3 Tests/HtmlGoTo/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native muted video regression
        run: python3 Tests/VideoPlayback/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native note Mermaid regression
        run: python3 Tests/NoteMermaid/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
      - name: Native note Mermaid prose churn regression
        run: |
          swift build --build-system native -c release -j 2 --product Easl -Xswiftc -enable-testing
          python3 Tests/NoteMermaidChurn/run.py --bin-path "$(swift build --build-system native -c release --show-bin-path)" --ci-timing-report-only
      - name: Install zmx for native keyboard regressions
        env:
          ZMX_VERSION: 0.8.1
        run: |
          case "$(uname -m)" in
            arm64) platform=aarch64; ZMX_SHA256=1d86b1c9fba47fa707a6f0e976b20510b07c1c26d0ed010b9414b2a2c5e6beef ;;
            x86_64) platform=x86_64; ZMX_SHA256=3208578ad91d8a62077772dc8a1369a92033d9e84169bac673ef8542b6ff9707 ;;
            *) exit 1 ;;
          esac
          archive="zmx-${ZMX_VERSION}-macos-${platform}.tar.gz"
          curl -fL -o "$RUNNER_TEMP/$archive" "https://github.com/neurosnap/zmx/releases/download/v${ZMX_VERSION}/$archive"
          printf '%s  %s\n' "$ZMX_SHA256" "$RUNNER_TEMP/$archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/native-zmx"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/native-zmx"
          echo "$RUNNER_TEMP/native-zmx" >> "$GITHUB_PATH"
      - name: Native selection and typing regression
        id: selection-typing
        run: python3 Tests/SelectionTyping/run.py --bin-path "$(swift build --build-system native -c release --show-bin-path)" --output "${{ runner.temp }}/selection-typing"
      - name: Preserve selection and typing evidence
        if: always() && steps.selection-typing.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: selection-typing
          path: ${{ runner.temp }}/selection-typing
          if-no-files-found: error
      - name: Native main-thread stall capture regression
        run: python3 Tests/StallSampler/run.py --bin-path "$(swift build --build-system native -c release --show-bin-path)" --output "${{ runner.temp }}/stall-sampler" --ci-timing-report-only
      - name: Native board save responsiveness and atomic crash regression
        run: python3 Tests/BoardSave/run.py --bin-path "$(swift build --build-system native -c release --show-bin-path)" --output "${{ runner.temp }}/board-save" --ci-timing-report-only
      - name: Generated clients are current
        run: bun scripts/gen-clients.ts --check
      - name: Python client tests
        run: cd clients/python && python3 -m unittest
      - name: TS client tests
        run: bun test clients/ts
      - name: CLI tests
        run: bun test cli
      - name: Agent hook tests
        run: bun test extensions/agent-hooks
      - name: Lead rotation script
        run: bun test scripts/rotate-lead.test.ts
      - name: Script tests
        run: python3 -m unittest discover -s scripts

  release-compatibility:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-go@v6
        with:
          go-version-file: easld/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select Swift 6.4
        run: scripts/select-ci-swift.sh
      - name: Released host and client compatibility
        run: python3 scripts/release-compatibility.py --output-dir "$RUNNER_TEMP/release-compatibility"
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-compatibility
          path: |
            ${{ runner.temp }}/release-compatibility/*.log
            ${{ runner.temp }}/release-compatibility/selection.json
            ${{ runner.temp }}/release-compatibility/legacy-journey.json
            ${{ runner.temp }}/release-compatibility/journey/journey.json
            ${{ runner.temp }}/release-compatibility/journey/terminal-output

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: conformance/go.mod
      - name: Vet
        working-directory: conformance
        run: go vet ./...
      - name: Test
        working-directory: conformance
        run: go test ./...
      - name: gofmt
        working-directory: conformance
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  easld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-go@v6
        with:
          go-version-file: easld/go.mod
      - name: Vet
        working-directory: easld
        run: go vet ./...
      - name: Install zmx
        working-directory: ${{ runner.temp }}
        env:
          ZMX_VERSION: '0.8.1'
          ZMX_SHA256: dfd75720b942466f28870731cc86dbc07afa72fb8f3bd5eeb4ff707e4eecebe8
        run: |
          archive="zmx-${ZMX_VERSION}-linux-x86_64.tar.gz"
          url="https://github.com/neurosnap/zmx/releases/download/v${ZMX_VERSION}"
          curl -fL --retry 3 -O "$url/$archive"
          curl -fL --retry 3 -O "$url/$archive.sha256"
          read -r release_sha256 _ < "$archive.sha256"
          test "$release_sha256" = "$ZMX_SHA256"
          printf '%s  %s\n' "$ZMX_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zmx"
          tar -xzf "$archive" -C "$RUNNER_TEMP/zmx"
          echo "$RUNNER_TEMP/zmx" >> "$GITHUB_PATH"
      - name: Test
        working-directory: easld
        run: go test -p 2 -v ./...
      - name: Build for Linux
        working-directory: easld
        run: GOOS=linux GOARCH=amd64 go build ./...
      - name: Build for macOS
        working-directory: easld
        run: GOOS=darwin GOARCH=arm64 go build ./...
      - name: gofmt
        working-directory: easld
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
