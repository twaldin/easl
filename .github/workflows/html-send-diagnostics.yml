name: HTML send readiness diagnostics

on:
  pull_request:
    paths:
      - Tests/HtmlSend/**
      - .github/workflows/html-send-diagnostics.yml
  workflow_dispatch:

jobs:
  native-readiness:
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scrollers: [system, disabled]
    steps:
      - uses: actions/checkout@v5
      - name: Select Swift 6.4 Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          swift --version
          git rev-parse HEAD
      - name: Build native app
        run: swift build --build-system native -j 2 --product Easl
      - name: Trace native replacement readiness
        env:
          EASL_HTML_SEND_NO_SCROLLERS: ${{ matrix.scrollers == 'disabled' && '1' || '0' }}
        run: python3 Tests/HtmlSend/run.py --bin-path "$(swift build --build-system native --show-bin-path)"
